[package]
name = "aipet-gpu-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
windows-capture = "=2.0.1"
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D_Fxc", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
